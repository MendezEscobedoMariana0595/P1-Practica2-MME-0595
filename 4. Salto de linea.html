<!DOCTYPE html> 
<!--sirve para indicarle al navegador web qué versión de HTML se está utilizando-->
<html lang="en">
<!--sirve para indicar el idioma principal-->

<head>
    <!--sección que guarda información general-->

    <meta charset="UTF-8">
    <!--indica que caracteres usar para mostraer correctamente el texto-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--le dice al navegador móvil cómo debe ajustar el tamaño y la escala de una página web-->

    <title>Salto de linea en HTML</title>
    <!-- define el título oficial de una página web-->
</head>
<!--cierre del encabezado-->

<body>
    <!-- etiqueta que define el cuerpo del documento y contiene todo el contenido visible de una página web-->
    <h1>Lenguaje de programacion</h1>
    <!--Encabezado principal-->
    <p><!--párrafo de texto-->En la actualidad se utilizan diferentes
        lenguajes de programacion tanto para desarrollo
        web, desarrollo movil, entranamiento de inteligencia
        artificial, pero de los mas usados son
        los siguientes:<br><!-- obliga a un salto de línea en el texto.-->
        Dart<br>
        Flutter<br>
        Python<br>
        Ruby<br>
        Java<br>
        TypeScript<br>
        Entre otros.
    </p>
    <!--Cierre del párrafo-->
</body>
   <!--Cierre del cuerpo-->

</html><!--marcador de cierre que indica el final de un documento HTML.-->
