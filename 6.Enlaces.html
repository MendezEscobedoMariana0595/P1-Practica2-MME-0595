<!DOCTYPE html> 
<!--sirve para indicarle al navegador web qué versión de HTML se está utilizando-->
<html lang="en">
<!--sirve para indicar el idioma principal-->

<head>
    <!--sección que guarda información general-->

    <meta charset="UTF-8">
    <!--indica que caracteres usar para mostraer correctamente el texto-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--le dice al navegador móvil cómo debe ajustar el tamaño y la escala de una página web-->

    <title>Enlaces en HTML</title>
    <!-- define el título oficial de una página web-->
</head>
<!--cierre del encabezado-->
<body>
    <!-- etiqueta que define el cuerpo del documento y contiene todo el contenido visible de una página web-->

    <h2>Tipos de enlaces en HTML</h2> <!--Encabezado principal-->
    <!--párrafo de texto-->
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p><!--sirve para marcar un texto que tiene mucha importancia, seriedad o urgencia-->

    <!--El atributo href en HTML sirve para indicar la dirección o destino al que apunta un enlace o hipervínculo-->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <a href="2. Encabezados.html" target="_self"><!--abrir un enlace en la misma pestaña o ventana (o en el mismo marco/iframe) donde el usuario hizo clic.-->
        2. Encabezados</a><br>
    <a href="3. Parrafos.html" target="_blank"><!--abrir un enlace en una pestaña o ventana nueva del navegador.-->
        3. Parrafos</a><br>
    <a href="4. Salto de linea.html" target="_parent"><!--sirve para abrir un enlace o la respuesta de un formulario dentro del marco padre-->
        4. Salto de linea</a><br>
    <a href="5. Enfatizado.html" target="_top"><!-- abrir un enlace o formulario en la ventana o pestaña completa del navegador-->
        5. Enfatizado</a><br>

<!--El atributo href en HTML sirve para indicar la dirección o destino al que apunta un enlace o hipervínculo-->
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>

    <a href="https://www.google.com/">Google</a><br>
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
</body>
<!--Cierre del cuerpo-->

</html><!--marcador de cierre que indica el final de un documento HTML.-->
