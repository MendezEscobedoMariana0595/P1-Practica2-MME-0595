<!DOCTYPE html> 
<!--sirve para indicarle al navegador web qué versión de HTML se está utilizando-->
<html lang="en">
<!--sirve para indicar el idioma principal-->

<head>
    <!--sección que guarda información general-->

    <meta charset="UTF-8">
    <!--indica que caracteres usar para mostraer correctamente el texto-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--le dice al navegador móvil cómo debe ajustar el tamaño y la escala de una página web-->

    <title>Imagenes en HTML</title>
    <!-- define el título oficial de una página web-->
</head>
<!--cierre del encabezado-->
<body>
    <!-- etiqueta que define el cuerpo del documento y contiene todo el contenido visible de una página web-->
    <h2>Imagenes en HTML</h2><!--Encabezado principal-->
    
    <h3>Locales</h3><!--Subtitulo o titulo con menos importancia-->
    <img src="caritas.png" alt="Imagen de carita feliz">
    <!--insertar y mostrar una imagen dentro de una página web-->
    
    <h3>Locales redismensionado</h3><!--Subtitulo o titulo con menos importancia-->
    <img src="imagenes/carita.png" alt="" width="200" height="100">
    <!--insertar y mostrar una imagen dentro de una página web-->

    <h3>Desde internet</h3>
    <!--Subtitulo o titulo con menos importancia-->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" 
    width="200" height="200"
    alt="">
    <!--insertar y mostrar una imagen dentro de una página web-->

    <h3>Animaciones</h3>
    <!--Subtitulo o titulo con menos importancia-->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" 
    width="200" height="200"
    alt="">
    <!--insertar y mostrar una imagen dentro de una página web-->

</body>
<!--Cierre del cuerpo-->
</html><!--marcador de cierre que indica el final de un documento HTML.-->
